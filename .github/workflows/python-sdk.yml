name: Python SDK

on:
  push:
    paths:
      - "packages/sdk-python/**"
      - ".github/workflows/python-sdk.yml"
  pull_request:
    paths:
      - "packages/sdk-python/**"
      - ".github/workflows/python-sdk.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/sdk-python

    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
